<head>

    <title>Ashutosh Gupta | Mobile Application Developer</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0;
            background: linear-gradient(135deg, #6750a4 0%, #7f67be 100%);

        .redirect-message {

        .spinner {
            width: 50px;
            height: 50px;

            border-top-color: white;
            border-radius: 50%;

            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

        <div class="spinner"></div>
