<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Blog by Ashutosh - Insights on Kotlin Multiplatform, Android Development, and Mobile Tech">
    <title>Blog - Ashutosh | Mobile Developer</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/blog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Navigation -->
    <div id="navbar-placeholder"></div>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1>Blog</h1>
            <p>Sharing my journey, insights, and learnings in mobile development</p>
        </div>
    </section>

    <!-- Blog Filter -->
    <section class="blog-filter">
        <div class="container">
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">All Posts</button>
                <button class="filter-btn" data-category="kmp">Kotlin Multiplatform</button>
                <button class="filter-btn" data-category="android">Android</button>
                <button class="filter-btn" data-category="tutorial">Tutorials</button>
                <button class="filter-btn" data-category="case-study">Case Studies</button>
            </div>
        </div>
    </section>

    <!-- Blog Posts Grid -->
    <section class="blog-section">
        <div class="container">
            <div id="blog-grid-container" class="blog-grid">
                <!-- Blog posts will be loaded here by JavaScript from data/blogs.json -->
            </div>
        </div>
    </section>

    <!-- Newsletter Section -->
    <section class="newsletter-section">
        <div class="container">
            <div class="newsletter-content">
                <h2><i class="fas fa-envelope"></i> Subscribe to my Newsletter</h2>
                <p>Get the latest articles and insights on mobile development directly in your inbox</p>
                <form class="newsletter-form">
                    <input type="email" placeholder="Enter your email" required>
                    <button type="submit" class="btn btn-primary">Subscribe</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Credentials -->
    <script src="credentials.js"></script>

    <!-- Scripts -->
    <script src="scripts/script.js"></script>
    <script src="scripts/blog.js"></script>
</body>

</html>
